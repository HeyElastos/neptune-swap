[package]
name = "neptune-provider"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "elastOS Runtime provider for elastos://neptune/*: typed Neptune reads over a loopback node"

[dependencies]
serde.workspace = true
serde_json.workspace = true
# tls: only for a development remote node (allow_remote_nodes); local nodes are plain http.
ureq = { version = "2", default-features = false, features = ["tls"] }
light-core = { path = "../light-core" }
intents-protocol = { path = "../intents-protocol" }
ed25519-dalek = "2"
base64 = "0.22"
anyhow.workspace = true
tokio = { version = "1.47", features = ["rt"] }

[dev-dependencies]
flate2 = "1"
