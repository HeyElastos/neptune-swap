[package]
name = "evm-signer"
description = "A native EVM key for the solver (and test users on a local chain): legacy EIP-155 transactions over JSON-RPC"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
serde_json.workspace = true
anyhow.workspace = true
ureq = { version = "2", default-features = false }
evm-htlc = { path = "../evm-htlc" }
