[package]
name = "htlc"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The Neptune half of an atomic swap: a hashed timelock lock script for Triton VM"

# The versions upstream neptune-core uses (Cargo.lock at v0.20.1, 404f7379): the lock script must run on
# exactly the VM that consensus verifies with.
[dependencies]
tasm-lib = "=9.0.0"
triton-vm = "=9.0.1"
sha2 = "0.10"
