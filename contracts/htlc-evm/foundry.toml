# The EVM half of a Neptune swap: tests with `forge test` (Foundry), no libraries.
[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = []
solc_version = "0.8.28"
# Shanghai, not Cancun: Cancun lets solc emit MCOPY, and an EVM chain without it (Elastos ESC
# rejects 0x5e, checked 2026-11-23) would revert every claim and refund, locking funds for good.
# Shanghai code runs on Base and Ethereum alike. evm-htlc's pin test refuses Cancun opcodes.
evm_version = "shanghai"
optimizer = true
optimizer_runs = 1000
# No metadata in the bytecode: the deployed code then depends only on the source and these
# settings, so anyone can rebuild it and check its hash (evm-htlc's RUNTIME_CODE_KECCAK).
bytecode_hash = "none"
cbor_metadata = false
